<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100">
  <!-- Define styles -->
  <defs>
    <style>
      .entity-table { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
      .reference-table { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .snapshot-table { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
      .core-table { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .table-header { fill: #333; }
      .table-header-text { fill: white; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .field-text { font-family: 'Courier New', monospace; font-size: 11px; fill: #333; }
      .field-pk { font-weight: bold; fill: #d32f2f; }
      .field-fk { fill: #1976d2; }
      .field-reference { fill: #388e3c; }
      .field-snapshot { fill: #f57c00; }
      .relationship { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .relationship-cascade { stroke: #d32f2f; stroke-width: 2; stroke-dasharray: 5,5; fill: none; marker-end: url(#arrowhead-red); }
      .label { font-family: Arial, sans-serif; font-size: 10px; fill: #666; }
      .legend-text { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title-text { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle-text { font-family: Arial, sans-serif; font-size: 14px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#d32f2f" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" class="title-text">v3.0 流转模型 ER 图</text>
  <text x="700" y="50" text-anchor="middle" class="subtitle-text">Weekly Report System - Flow Model Architecture</text>

  <!-- Users Table (Top Left) -->
  <rect x="50" y="80" width="180" height="140" class="entity-table" rx="5"/>
  <rect x="50" y="80" width="180" height="30" class="table-header" rx="5"/>
  <text x="140" y="100" text-anchor="middle" class="table-header-text">users</text>
  <text x="60" y="130" class="field-text field-pk">● id (PK)</text>
  <text x="60" y="150" class="field-text">name</text>
  <text x="60" y="170" class="field-text">email</text>
  <text x="60" y="190" class="field-text">role (admin/dev/external)</text>
  <text x="60" y="210" class="field-text">created_at</text>

  <!-- Departments Table -->
  <rect x="50" y="260" width="180" height="120" class="entity-table" rx="5"/>
  <rect x="50" y="260" width="180" height="30" class="table-header" rx="5"/>
  <text x="140" y="280" text-anchor="middle" class="table-header-text">departments</text>
  <text x="60" y="310" class="field-text field-pk">● id (PK)</text>
  <text x="60" y="330" class="field-text">name</text>
  <text x="60" y="350" class="field-text">created_at</text>

  <!-- Project Types Table -->
  <rect x="300" y="320" width="180" height="120" class="entity-table" rx="5"/>
  <rect x="300" y="320" width="180" height="30" class="table-header" rx="5"/>
  <text x="390" y="340" text-anchor="middle" class="table-header-text">project_types</text>
  <text x="310" y="370" class="field-text field-pk">● id (PK)</text>
  <text x="310" y="390" class="field-text">name</text>
  <text x="310" y="410" class="field-text">created_at</text>

  <!-- Projects Table (Core) -->
  <rect x="300" y="80" width="200" height="180" class="core-table" rx="5"/>
  <rect x="300" y="80" width="200" height="30" class="table-header" rx="5"/>
  <text x="400" y="100" text-anchor="middle" class="table-header-text">projects (项目)</text>
  <text x="310" y="130" class="field-text field-pk">● id (PK)</text>
  <text x="310" y="150" class="field-text">software_name</text>
  <text x="310" y="170" class="field-text">project_type_id (FK)</text>
  <text x="310" y="190" class="field-text">department_id (FK)</text>
  <text x="310" y="210" class="field-text">is_critical</text>
  <text x="310" y="230" class="field-text">created_at</text>
  <text x="310" y="250" class="field-text">updated_at</text>

  <!-- Sprints Table (Core) -->
  <rect x="570" y="80" width="200" height="180" class="core-table" rx="5"/>
  <rect x="570" y="80" width="200" height="30" class="table-header" rx="5"/>
  <text x="670" y="100" text-anchor="middle" class="table-header-text">sprints (迭代)</text>
  <text x="580" y="130" class="field-text field-pk">● id (PK)</text>
  <text x="580" y="150" class="field-text">sprint_number (UQ)</text>
  <text x="580" y="170" class="field-text">start_date</text>
  <text x="580" y="190" class="field-text">end_date</text>
  <text x="580" y="210" class="field-text">status (current/archived/planned)</text>
  <text x="580" y="230" class="field-text">created_at</text>

  <!-- Sprint_Projects Table (Snapshot) -->
  <rect x="650" y="300" width="240" height="200" class="snapshot-table" rx="5"/>
  <rect x="650" y="300" width="240" height="30" class="table-header" rx="5"/>
  <text x="770" y="320" text-anchor="middle" class="table-header-text">sprint_projects (项目快照表)</text>
  <text x="660" y="350" class="field-text field-pk">● id (PK)</text>
  <text x="660" y="370" class="field-text field-fk">○ sprint_id (FK)</text>
  <text x="660" y="390" class="field-text field-fk">○ project_id (FK)</text>
  <text x="660" y="410" class="field-text">UNIQUE(sprint_id, project_id)</text>
  <text x="660" y="435" class="field-text field-snapshot">⭐ priority (快照字段)</text>
  <text x="660" y="455" class="field-text field-snapshot">⭐ notes</text>
  <text x="660" y="475" class="field-text">added_at</text>
  <text x="660" y="495" class="field-text">updated_at</text>

  <!-- Stories Table (Reference) -->
  <rect x="50" y="450" width="220" height="240" class="reference-table" rx="5"/>
  <rect x="50" y="450" width="220" height="30" class="table-header" rx="5"/>
  <text x="160" y="470" text-anchor="middle" class="table-header-text">stories (计划 - 引用表)</text>
  <text x="60" y="500" class="field-text field-pk">● id (PK)</text>
  <text x="60" y="520" class="field-text field-fk">○ project_id (FK)</text>
  <text x="60" y="545" class="field-text field-reference">⭐ title (引用字段)</text>
  <text x="60" y="565" class="field-text field-reference">⭐ description</text>
  <text x="60" y="585" class="field-text field-reference">⭐ planned_start_date</text>
  <text x="60" y="605" class="field-text field-reference">⭐ planned_end_date</text>
  <text x="60" y="625" class="field-text field-reference">⭐ is_critical</text>
  <text x="60" y="645" class="field-text">created_by (FK)</text>
  <text x="60" y="665" class="field-text">created_at</text>
  <text x="60" y="685" class="field-text">updated_at</text>

  <!-- Sprint_Stories Table (Snapshot) -->
  <rect x="350" y="450" width="240" height="260" class="snapshot-table" rx="5"/>
  <rect x="350" y="450" width="240" height="30" class="table-header" rx="5"/>
  <text x="470" y="470" text-anchor="middle" class="table-header-text">sprint_stories (快照表)</text>
  <text x="360" y="500" class="field-text field-pk">● id (PK)</text>
  <text x="360" y="520" class="field-text field-fk">○ project_id (FK)</text>
  <text x="360" y="540" class="field-text field-fk">○ sprint_id (FK)</text>
  <text x="360" y="560" class="field-text field-fk">○ story_id (FK)</text>
  <text x="360" y="580" class="field-text">UNIQUE(sprint_id, story_id)</text>
  <text x="360" y="605" class="field-text field-snapshot">⭐ status (快照字段)</text>
  <text x="360" y="625" class="field-text field-snapshot">⭐ progress</text>
  <text x="360" y="645" class="field-text field-snapshot">⭐ assigned_to (FK)</text>
  <text x="360" y="665" class="field-text field-snapshot">⭐ notes</text>
  <text x="360" y="685" class="field-text">added_at</text>
  <text x="360" y="705" class="field-text">updated_at</text>

  <!-- Tasks Table (Reference) -->
  <rect x="700" y="450" width="220" height="200" class="reference-table" rx="5"/>
  <rect x="700" y="450" width="220" height="30" class="table-header" rx="5"/>
  <text x="810" y="470" text-anchor="middle" class="table-header-text">tasks (任务 - 引用表)</text>
  <text x="710" y="500" class="field-text field-pk">● id (PK)</text>
  <text x="710" y="520" class="field-text field-fk">○ project_id (FK)</text>
  <text x="710" y="540" class="field-text field-fk">○ story_id (FK, nullable)</text>
  <text x="710" y="565" class="field-text field-reference">⭐ title (引用字段)</text>
  <text x="710" y="585" class="field-text field-reference">⭐ description</text>
  <text x="710" y="605" class="field-text">created_at</text>
  <text x="710" y="625" class="field-text">updated_at</text>

  <!-- Sprint_Tasks Table (Snapshot) -->
  <rect x="1010" y="450" width="260" height="280" class="snapshot-table" rx="5"/>
  <rect x="1010" y="450" width="260" height="30" class="table-header" rx="5"/>
  <text x="1140" y="470" text-anchor="middle" class="table-header-text">sprint_tasks (快照表)</text>
  <text x="1020" y="500" class="field-text field-pk">● id (PK)</text>
  <text x="1020" y="520" class="field-text field-fk">○ project_id (FK)</text>
  <text x="1020" y="540" class="field-text field-fk">○ sprint_id (FK)</text>
  <text x="1020" y="560" class="field-text field-fk">○ task_id (FK)</text>
  <text x="1020" y="580" class="field-text field-fk">○ story_id (FK, nullable)</text>
  <text x="1020" y="600" class="field-text">UNIQUE(sprint_id, task_id)</text>
  <text x="1020" y="625" class="field-text field-snapshot">⭐ status (快照字段)</text>
  <text x="1020" y="645" class="field-text field-snapshot">⭐ progress</text>
  <text x="1020" y="665" class="field-text field-snapshot">⭐ assigned_to (FK)</text>
  <text x="1020" y="685" class="field-text field-snapshot">⭐ risk_and_countermeasure</text>
  <text x="1020" y="705" class="field-text field-snapshot">⭐ notes</text>
  <text x="1020" y="725" class="field-text">added_at</text>
  <text x="1020" y="745" class="field-text">updated_at</text>

  <!-- Relationships -->

  <!-- projects -> departments -->
  <path d="M 300 190 L 240 190 L 240 320 L 230 320" class="relationship"/>

  <!-- projects -> project_types -->
  <path d="M 390 260 L 390 320" class="relationship"/>

  <!-- sprint_projects -> sprints (CASCADE DELETE) -->
  <path d="M 770 300 L 770 280 L 670 280 L 670 260" class="relationship-cascade"/>
  <text x="690" y="275" class="label">CASCADE</text>

  <!-- sprint_projects -> projects (CASCADE DELETE) -->
  <path d="M 650 390 L 540 390 L 540 260" class="relationship-cascade"/>
  <text x="550" y="385" class="label">CASCADE</text>

  <!-- stories -> projects -->
  <path d="M 160 450 L 160 380 L 400 380 L 400 280" class="relationship"/>

  <!-- stories -> users (created_by) -->
  <path d="M 50 645 L 30 645 L 30 140 L 50 140" class="relationship"/>

  <!-- sprint_stories -> sprints (CASCADE DELETE) -->
  <path d="M 470 450 L 470 380 L 670 380 L 670 260" class="relationship-cascade"/>
  <text x="580" y="370" class="label">CASCADE DELETE</text>

  <!-- sprint_stories -> stories (CASCADE DELETE) -->
  <path d="M 350 570 L 270 570" class="relationship-cascade"/>

  <!-- sprint_stories -> users (assigned_to) -->
  <path d="M 470 450 L 470 420 L 140 420 L 140 220" class="relationship"/>

  <!-- sprint_stories -> projects -->
  <path d="M 470 450 L 470 340 L 500 340 L 500 280" class="relationship"/>

  <!-- tasks -> projects -->
  <path d="M 810 450 L 810 380 L 500 380 L 500 280" class="relationship"/>

  <!-- tasks -> stories (nullable, SET NULL) -->
  <path d="M 700 540 L 650 540 L 650 570 L 590 570" class="relationship"/>
  <text x="600" y="555" class="label">SET NULL</text>

  <!-- sprint_tasks -> sprints (CASCADE DELETE) -->
  <path d="M 1140 450 L 1140 380 L 770 380 L 770 260" class="relationship-cascade"/>
  <text x="850" y="370" class="label">CASCADE DELETE</text>

  <!-- sprint_tasks -> tasks (CASCADE DELETE) -->
  <path d="M 1010 560 L 920 560" class="relationship-cascade"/>

  <!-- sprint_tasks -> projects -->
  <path d="M 1140 450 L 1140 350 L 500 350 L 500 280" class="relationship"/>

  <!-- sprint_tasks -> stories (nullable) -->
  <path d="M 1010 580 L 980 580 L 980 750 L 270 750 L 270 640" class="relationship"/>

  <!-- sprint_tasks -> users (assigned_to) -->
  <path d="M 1140 450 L 1140 410 L 140 410 L 140 220" class="relationship"/>

  <!-- Legend -->
  <rect x="50" y="770" width="1200" height="280" fill="none" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="70" y="795" class="legend-text" font-weight="bold">图例 (Legend):</text>

  <!-- Table Types -->
  <text x="70" y="820" class="legend-text" font-weight="bold">表类型:</text>
  <rect x="70" y="830" width="100" height="25" class="reference-table" rx="3"/>
  <text x="75" y="847" class="legend-text">引用表 (Reference)</text>

  <rect x="200" y="830" width="100" height="25" class="snapshot-table" rx="3"/>
  <text x="205" y="847" class="legend-text">快照表 (Snapshot)</text>

  <rect x="330" y="830" width="100" height="25" class="core-table" rx="3"/>
  <text x="335" y="847" class="legend-text">核心实体表</text>

  <rect x="460" y="830" width="100" height="25" class="entity-table" rx="3"/>
  <text x="465" y="847" class="legend-text">辅助表</text>

  <!-- Field Types -->
  <text x="70" y="885" class="legend-text" font-weight="bold">字段类型:</text>
  <text x="70" y="905" class="field-text field-pk">● PK = 主键 (Primary Key)</text>
  <text x="70" y="925" class="field-text field-fk">○ FK = 外键 (Foreign Key)</text>
  <text x="70" y="945" class="field-text field-reference">⭐ 引用字段 = 全局共享，所有迭代相同</text>
  <text x="70" y="965" class="field-text field-snapshot">⭐ 快照字段 = 迭代特定，每个迭代可能不同</text>

  <!-- Relationship Types -->
  <text x="450" y="885" class="legend-text" font-weight="bold">关系类型:</text>
  <line x1="450" y1="900" x2="550" y2="900" class="relationship"/>
  <text x="560" y="905" class="legend-text">普通外键关系</text>

  <line x1="450" y1="920" x2="550" y2="920" class="relationship-cascade"/>
  <text x="560" y="925" class="legend-text">级联删除 (CASCADE DELETE)</text>

  <!-- Key Concepts -->
  <text x="70" y="1000" class="legend-text" font-weight="bold">核心概念:</text>
  <text x="70" y="1020" class="legend-text">1. 流转模型: Story/Task ID 在所有迭代中保持不变</text>
  <text x="70" y="1037" class="legend-text">2. 双表设计: 引用表存储全局属性，快照表存储迭代特定状态</text>
  <text x="750" y="1020" class="legend-text">3. QuickImport: 通过 sprint_stories/sprint_tasks 加入新迭代</text>
  <text x="750" y="1037" class="legend-text">4. 数据一致性: 单一数据源 (Single Source of Truth)</text>
</svg>
