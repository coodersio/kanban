<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>参与项目统计 - 低保真原型</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f3ee;
            --panel: #fffdf8;
            --panel-strong: #f0ebe0;
            --line: #d9d1c1;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #9a3412;
            --accent-soft: #f8dfd1;
            --accent-strong: #7c2d12;
            --ok: #166534;
            --warn: #9a3412;
            --shadow: 0 14px 32px rgba(31, 41, 55, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(154, 52, 18, 0.08), transparent 28%),
                linear-gradient(180deg, #f8f5ef 0%, var(--bg) 100%);
            color: var(--text);
        }

        .shell {
            max-width: 1240px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .hero {
            background: linear-gradient(135deg, #fffaf2 0%, #f6efe4 100%);
            border: 1px solid rgba(154, 52, 18, 0.14);
            border-radius: 24px;
            padding: 28px 28px 24px;
            box-shadow: var(--shadow);
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 30px;
            line-height: 1.1;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        .panel {
            margin-top: 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .filter-grid {
            padding: 24px 24px 16px;
            display: grid;
            gap: 18px;
        }

        .filter-row {
            display: grid;
            grid-template-columns: 92px 1fr;
            gap: 14px;
            align-items: start;
        }

        .filter-title {
            padding-top: 10px;
            font-weight: 700;
            color: var(--accent-strong);
        }

        .filter-body {
            display: grid;
            gap: 10px;
        }

        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chip {
            border: 1px solid var(--line);
            background: #ffffff;
            color: var(--text);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            transition: 140ms ease;
        }

        .chip:hover {
            border-color: #c57b57;
            transform: translateY(-1px);
        }

        .chip.active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-weight: 700;
        }

        .selected-text {
            font-size: 13px;
            color: var(--muted);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 24px;
            border-top: 1px solid var(--line);
            background: var(--panel-strong);
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button {
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            transition: 140ms ease;
        }

        .button.primary {
            background: var(--accent);
            color: #fff;
        }

        .button.primary:hover {
            background: var(--accent-strong);
        }

        .button.secondary {
            border-color: var(--line);
            background: #fff;
            color: var(--text);
        }

        .button.secondary:hover {
            border-color: #c57b57;
        }

        .button.copy {
            border-color: #b6d3bf;
            background: #effaf3;
            color: var(--ok);
            font-weight: 700;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stat {
            min-width: 132px;
            padding: 12px 14px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 800;
        }

        .table-wrap {
            overflow: auto;
            padding: 18px 24px 24px;
        }

        .empty-panel {
            padding: 44px 16px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed #dccfb9;
            border-radius: 18px;
            background: #fffaf4;
        }

        table {
            width: 100%;
            min-width: 980px;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
        }

        thead th {
            text-align: left;
            padding: 14px 16px;
            background: #f7efe4;
            color: #7c2d12;
            font-size: 13px;
            letter-spacing: 0.02em;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid #ece6d8;
            vertical-align: top;
            font-size: 14px;
        }

        tbody tr:nth-child(even) {
            background: #fffaf4;
        }

        tbody tr:hover {
            background: #fef2ea;
        }

        .project-cell {
            font-weight: 800;
            color: var(--accent-strong);
            background: linear-gradient(180deg, #fff9f0 0%, #fff4e8 100%);
            min-width: 190px;
            vertical-align: top;
        }

        .milestone-cell {
            min-width: 380px;
        }

        .milestone-box {
            border: 1px solid #e3d6bf;
            border-radius: 16px;
            background: linear-gradient(180deg, #fffdf9 0%, #fff7ec 100%);
            padding: 12px 14px;
        }

        .milestone-list {
            margin: 0;
            padding-left: 0;
            list-style: none;
            display: grid;
            gap: 12px;
        }

        .milestone-item {
            line-height: 1.5;
        }

        .milestone-index {
            font-weight: 700;
            color: var(--accent-strong);
        }

        .milestone-name {
            font-weight: 600;
            color: var(--text);
        }

        .milestone-line {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text);
            line-height: 1.5;
        }

        .meta-stack {
            display: grid;
            gap: 6px;
        }

        .meta-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.45;
        }

        .member-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .person-pill {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid #d7dbe5;
            background: #f8fafc;
            color: #334155;
            white-space: nowrap;
        }

        .person-pill.owner {
            border-color: #f3c980;
            background: #fff7dc;
            color: #92400e;
        }

        .person-pill.member {
            border-color: #bfd3ff;
            background: #edf4ff;
            color: #1d4ed8;
        }

        .sprint-cell {
            min-width: 170px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .tag.role-owner {
            background: #fef3c7;
            border-color: #f5d591;
            color: #92400e;
        }

        .tag.role-member {
            background: #e8f1ff;
            border-color: #bfd3ff;
            color: #1d4ed8;
        }

        .tag.status-done {
            background: #e9f8ee;
            border-color: #bfe6ca;
            color: var(--ok);
        }

        .tag.status-progress {
            background: #fff3e8;
            border-color: #f4cfb1;
            color: var(--warn);
        }

        .footer-note {
            padding: 0 24px 24px;
            color: var(--muted);
            font-size: 13px;
        }

        .toast {
            min-height: 20px;
            font-size: 13px;
            color: var(--muted);
        }

        @media (max-width: 900px) {
            .filter-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .filter-title {
                padding-top: 0;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left,
            .toolbar-right {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <h1>参与项目统计</h1>
            <p>低保真原型：一行一个项目。第二列把该项目的所有关键节点放进同一个内容框里，并按“无完成时间优先，其次按完成时间降序”编号排列。</p>
        </section>

        <section class="panel">
            <div class="filter-grid">
                <div class="filter-row">
                    <div class="filter-title">迭代</div>
                    <div class="filter-body">
                        <div class="chip-list" id="sprint-chips"></div>
                        <div class="selected-text" id="sprint-selected-text"></div>
                    </div>
                </div>

                <div class="filter-row">
                    <div class="filter-title">成员</div>
                    <div class="filter-body">
                        <div class="chip-list" id="member-chips"></div>
                        <div class="selected-text" id="member-selected-text"></div>
                    </div>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="button secondary" id="reset-button">清空筛选</button>
                    <button class="button copy" id="copy-button">复制到 Excel</button>
                    <div class="toast" id="toast-text">筛选切换后会自动刷新，复制内容与当前聚合表格保持一致。</div>
                </div>
                <div class="toolbar-right stats">
                    <div class="stat">
                        <div class="stat-label">项目数</div>
                        <div class="stat-value" id="project-count">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">关键节点数</div>
                        <div class="stat-value" id="milestone-count">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">成员数</div>
                        <div class="stat-value" id="member-count">0</div>
                    </div>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>项目名称</th>
                            <th>关键节点</th>
                            <th>参与迭代</th>
                            <th>成员</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <div class="footer-note" id="footer-note">共 0 个项目，0 个关键节点</div>
        </section>
    </div>

    <script>
        const rows = [
            { project: "壁挂炉", sprint: "W12", milestone: "壁挂炉后端需求讨论以及功能修改", member: "陈明宇", role: "负责人", status: "已完成", completedAt: "2026-03-20" },
            { project: "壁挂炉", sprint: "W13", milestone: "壁挂炉后端需求讨论以及功能修改", member: "陈明宇", role: "负责人", status: "已完成", completedAt: "2026-03-27" },
            { project: "壁挂炉", sprint: "W14", milestone: "壁挂炉后端需求讨论以及功能修改", member: "陈明宇", role: "负责人", status: "已完成", completedAt: "2026-04-03" },
            { project: "壁挂炉", sprint: "W15", milestone: "壁挂炉后端需求讨论以及功能修改", member: "陈明宇", role: "负责人", status: "进行中", completedAt: "" },
            { project: "四方MES系统", sprint: "W13", milestone: "评审MES系统各个模块功能以及开发周期", member: "陈明宇", role: "负责人", status: "进行中", completedAt: "2026-03-27" },
            { project: "四方MES系统", sprint: "W14", milestone: "预研现有MES系统以及通用术语功能等", member: "陈明宇", role: "负责人", status: "进行中", completedAt: "2026-04-03" },
            { project: "四方MES系统", sprint: "W15", milestone: "预研现有MES系统以及通用术语功能等", member: "陈明宇", role: "负责人", status: "进行中", completedAt: "" },
            { project: "DN流量计平台", sprint: "W12", milestone: "完成客户新增需求后端开发", member: "陈明宇", role: "负责人", status: "已完成", completedAt: "2026-03-20" },
            { project: "DN流量计平台", sprint: "W13", milestone: "完成客户新增需求后端开发", member: "陈明宇", role: "负责人", status: "已完成", completedAt: "2026-03-27" },
            { project: "DN流量计平台", sprint: "W14", milestone: "完成客户新增需求后端开发", member: "陈明宇", role: "负责人", status: "已完成", completedAt: "2026-04-03" },
            { project: "管道阀门云平台", sprint: "W12", milestone: "跟踪测试线上新版本功能", member: "陈明宇", role: "参与人", status: "已完成", completedAt: "2026-03-20" },
            { project: "肺功能云平台", sprint: "W12", milestone: "完成云端部署以及配置", member: "陈明宇", role: "参与人", status: "已完成", completedAt: "2026-03-20" },
            { project: "燃气表平台(标准版)", sprint: "W13", milestone: "完成新平台账号以及权限分配", member: "陈明宇", role: "负责人", status: "已完成", completedAt: "2026-03-27" },
            { project: "Emission QA Board", sprint: "W14", milestone: "接口联测", member: "张洁", role: "参与人", status: "进行中", completedAt: "" },
            { project: "Emission QA Board", sprint: "W15", milestone: "接口联测", member: "张洁", role: "参与人", status: "进行中", completedAt: "" },
            { project: "Flow Calibration", sprint: "W15", milestone: "联调现场确认", member: "陈剑锋", role: "负责人", status: "已完成", completedAt: "2026-04-03" }
        ];

        const sprintOptions = Array.from(new Set(rows.map((row) => row.sprint)));
        const memberOptions = Array.from(new Set(rows.map((row) => row.member)));

        const selected = {
            sprints: new Set(),
            members: new Set(memberOptions)
        };

        const sprintChips = document.getElementById("sprint-chips");
        const memberChips = document.getElementById("member-chips");
        const sprintSelectedText = document.getElementById("sprint-selected-text");
        const memberSelectedText = document.getElementById("member-selected-text");
        const tableBody = document.getElementById("table-body");
        const footerNote = document.getElementById("footer-note");
        const toastText = document.getElementById("toast-text");

        function createChip(group, value, label, isAll) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "chip";
            button.textContent = label;
            button.dataset.group = group;
            button.dataset.value = value;
            if (isAll) button.dataset.all = "true";
            button.addEventListener("click", () => toggleChip(group, value, isAll));
            return button;
        }

        function renderChipGroups() {
            sprintChips.innerHTML = "";
            memberChips.innerHTML = "";

            sprintChips.appendChild(createChip("sprints", "__all__", "全部", true));
            sprintOptions.forEach((option) => sprintChips.appendChild(createChip("sprints", option, option, false)));

            memberChips.appendChild(createChip("members", "__all__", "全部", true));
            memberOptions.forEach((option) => memberChips.appendChild(createChip("members", option, option, false)));

            syncChipStates();
            renderSelectionText();
        }

        function toggleChip(group, value, isAll) {
            const options = group === "sprints" ? sprintOptions : memberOptions;
            const targetSet = selected[group];

                if (isAll) {
                    if (targetSet.size === options.length) {
                        targetSet.clear();
                    } else {
                        targetSet.clear();
                        options.forEach((item) => targetSet.add(item));
                    }
                    syncChipStates();
                    renderSelectionText();
                    renderTable();
                    return;
                }

            if (targetSet.has(value)) {
                targetSet.delete(value);
            } else {
                targetSet.add(value);
            }

            syncChipStates();
            renderSelectionText();
            renderTable();
        }

        function syncChipStates() {
            document.querySelectorAll(".chip").forEach((chip) => {
                const group = chip.dataset.group;
                const value = chip.dataset.value;
                const options = group === "sprints" ? sprintOptions : memberOptions;

                if (chip.dataset.all === "true") {
                    chip.classList.toggle("active", selected[group].size === options.length);
                } else {
                    chip.classList.toggle("active", selected[group].has(value));
                }
            });
        }

        function renderSelectionText() {
            sprintSelectedText.textContent = selected.sprints.size === 0
                ? "已选：未选择"
                : selected.sprints.size === sprintOptions.length
                    ? "已选：全部迭代"
                    : `已选：${Array.from(selected.sprints).join(", ")}`;

            memberSelectedText.textContent = selected.members.size === 0
                ? "已选：未选择"
                : selected.members.size === memberOptions.length
                    ? "已选：全部成员"
                    : `已选：${Array.from(selected.members).join(", ")}`;
        }

        function getFilteredRows() {
            return rows.filter((row) => selected.sprints.has(row.sprint) && selected.members.has(row.member));
        }

        function getSprintOrder(sprint) {
            const match = String(sprint).match(/(\d+)/);
            return match ? Number(match[1]) : 0;
        }

        function getGroupedProjects() {
            if (selected.sprints.size === 0 || selected.members.size === 0) {
                return [];
            }

            const projectMap = new Map();

            getFilteredRows().forEach((row) => {
                if (!projectMap.has(row.project)) {
                    projectMap.set(row.project, {
                        project: row.project,
                        sprints: new Set(),
                        members: new Map(),
                        milestones: new Map()
                    });
                }

                const project = projectMap.get(row.project);
                project.sprints.add(row.sprint);
                project.members.set(row.member, row.role === "负责人" ? "负责人" : (project.members.get(row.member) || "参与人"));

                const key = row.milestone;
                const sprintOrder = getSprintOrder(row.sprint);

                if (!project.milestones.has(key)) {
                    project.milestones.set(key, {
                        milestone: row.milestone,
                        sprints: new Set([row.sprint]),
                        members: new Map([[row.member, row.role]]),
                        latestStatus: row.status,
                        latestSprintOrder: sprintOrder,
                        latestCompletedAt: row.completedAt || "",
                        latestCompletedValue: row.completedAt ? new Date(row.completedAt).getTime() : 0
                    });
                    return;
                }

                const current = project.milestones.get(key);
                current.sprints.add(row.sprint);
                current.members.set(row.member, row.role === "负责人" ? "负责人" : (current.members.get(row.member) || "参与人"));

                if (sprintOrder >= current.latestSprintOrder) {
                    current.latestSprintOrder = sprintOrder;
                    current.latestStatus = row.status;
                }

                const completedValue = row.completedAt ? new Date(row.completedAt).getTime() : 0;
                if (completedValue >= current.latestCompletedValue) {
                    current.latestCompletedValue = completedValue;
                    current.latestCompletedAt = row.completedAt || "";
                }
            });

            return Array.from(projectMap.values())
                .map((project) => ({
                    project: project.project,
                    sprints: Array.from(project.sprints).sort((a, b) => getSprintOrder(a) - getSprintOrder(b)),
                    members: Array.from(project.members.entries())
                        .sort((a, b) => a[0].localeCompare(b[0], "zh-CN"))
                        .map(([name, role]) => ({ name, role })),
                    milestones: Array.from(project.milestones.values())
                        .map((item) => ({
                            milestone: item.milestone,
                            sprints: Array.from(item.sprints).sort((a, b) => getSprintOrder(a) - getSprintOrder(b)),
                            members: Array.from(item.members.entries())
                                .sort((a, b) => a[0].localeCompare(b[0], "zh-CN"))
                                .map(([name, role]) => ({ name, role })),
                            status: item.latestStatus,
                            completedAt: item.latestCompletedAt
                        }))
                        .sort((a, b) => {
                            const aPending = !a.completedAt;
                            const bPending = !b.completedAt;
                            if (aPending && !bPending) return -1;
                            if (!aPending && bPending) return 1;
                            if (a.completedAt && b.completedAt) {
                                return new Date(b.completedAt).getTime() - new Date(a.completedAt).getTime();
                            }
                            return a.milestone.localeCompare(b.milestone, "zh-CN");
                        })
                }))
                .sort((a, b) => a.project.localeCompare(b.project, "zh-CN"));
        }

        function renderTable() {
            const groupedProjects = getGroupedProjects();
            const projectCount = groupedProjects.length;
            const milestoneCount = groupedProjects.reduce((sum, project) => sum + project.milestones.length, 0);
            const memberCount = new Set(
                groupedProjects.flatMap((project) => project.members.map((member) => member.name))
            ).size;

            tableBody.innerHTML = "";

            if (groupedProjects.length === 0) {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td colspan="4" style="text-align:center; color:#6b7280; padding:40px 16px;">
                        ${selected.sprints.size === 0 && selected.members.size === 0
                            ? "请选择至少一个迭代和一个成员"
                            : selected.sprints.size === 0
                                ? "请选择至少一个迭代"
                                : selected.members.size === 0
                                    ? "请选择至少一个成员"
                                    : "当前筛选条件下暂无项目"}
                    </td>
                `;
                tableBody.appendChild(tr);
            } else {
                groupedProjects.forEach((project) => {
                    const tr = document.createElement("tr");

                    const projectCell = document.createElement("td");
                    projectCell.className = "project-cell";
                    projectCell.textContent = project.project;

                    const milestoneCell = document.createElement("td");
                    milestoneCell.className = "milestone-cell";
                    milestoneCell.innerHTML = `
                        <div class="milestone-box">
                            <ol class="milestone-list">
                                ${project.milestones.map((milestone, index) => `
                                    <li class="milestone-item">
                                        <div class="milestone-line">
                                            <span class="milestone-index">${index + 1}）</span>
                                            <span class="milestone-name">${milestone.milestone}</span>
                                            <span> | ${milestone.status} | ${milestone.completedAt || "—"}</span>
                                        </div>
                                    </li>
                                `).join("")}
                            </ol>
                        </div>
                    `;

                    const sprintCell = document.createElement("td");
                    sprintCell.className = "sprint-cell";
                    sprintCell.innerHTML = `
                        <div class="meta-stack">
                            <div class="meta-text">${project.sprints.join(", ")}</div>
                        </div>
                    `;

                    const memberCell = document.createElement("td");
                    memberCell.innerHTML = `
                        <div class="member-pills">
                            ${project.members.map((member) => `
                                <span class="person-pill ${member.role === "负责人" ? "owner" : "member"}">
                                    ${member.name} / ${member.role}
                                </span>
                            `).join("")}
                        </div>
                    `;

                    tr.appendChild(projectCell);
                    tr.appendChild(milestoneCell);
                    tr.appendChild(sprintCell);
                    tr.appendChild(memberCell);
                    tableBody.appendChild(tr);
                });
            }

            document.getElementById("project-count").textContent = projectCount;
            document.getElementById("milestone-count").textContent = milestoneCount;
            document.getElementById("member-count").textContent = memberCount;
            footerNote.textContent = `共 ${projectCount} 个项目，${milestoneCount} 个关键节点`;
            toastText.textContent = "统计结果已刷新。当前是“一行一个项目”，关键节点集中在第二列的内容框中。";
        }

        async function copyVisibleRows() {
            const groupedProjects = getGroupedProjects();
            const flattenedRows = groupedProjects.map((project) => ({
                project: project.project,
                milestones: project.milestones.map((milestone, index) => `${index + 1}）${milestone.milestone} | ${milestone.status} | ${milestone.completedAt || "—"}`).join("； "),
                sprints: project.sprints.join(", "),
                members: project.members.map((member) => `${member.name}(${member.role})`).join(", ")
            }));

            if (flattenedRows.length === 0) {
                toastText.textContent = "当前没有可复制的数据。";
                return;
            }

            const header = ["项目名称", "关键节点", "参与迭代", "成员"];
            const lines = flattenedRows.map((row) => [
                row.project,
                row.milestones,
                row.sprints,
                row.members,
            ]);

            const tsv = [header, ...lines]
                .map((line) => line.join("\t"))
                .join("\n");

            try {
                await navigator.clipboard.writeText(tsv);
                toastText.textContent = `已复制 ${flattenedRows.length} 条项目记录。可直接粘贴到 Excel。`;
            } catch (error) {
                toastText.textContent = "复制失败：当前浏览器环境不允许写入剪贴板。";
            }
        }

        document.getElementById("reset-button").addEventListener("click", () => {
            selected.sprints.clear();
            selected.members.clear();
            memberOptions.forEach((item) => selected.members.add(item));
            syncChipStates();
            renderSelectionText();
            renderTable();
        });

        document.getElementById("copy-button").addEventListener("click", copyVisibleRows);

        renderChipGroups();
        renderTable();
    </script>
</body>
</html>
