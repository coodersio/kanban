services:
  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: kanban_nginx
    ports:
      - "5003:80"  # VPS 的 5003 端口映射到容器的 80 端口
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - kanban_network

  # 前端
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: kanban-frontend:latest
    container_name: kanban_frontend
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - kanban_network

  # 后端
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: kanban-backend:latest
    container_name: kanban_backend
    environment:
      - PORT=5002
      - DATABASE_URL=postgresql://kanban_user:${POSTGRES_PASSWORD:-kanban_password}@postgres:5432/kanban_db
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-your_secret_key_here}
      - CORS_ORIGIN=*
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - kanban_network

  # PostgreSQL 数据库
  postgres:
    image: postgres:16
    container_name: kanban_postgres
    environment:
      POSTGRES_DB: kanban_db
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kanban_network

volumes:
  postgres_data:

networks:
  kanban_network:
    driver: bridge
