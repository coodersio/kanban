services:
  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: kanban_nginx
    ports:
      - "5003:80"  # VPS 的 5003 端口映射到容器的 80 端口
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - kanban_network

  # 前端
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: kanban-frontend:latest
    container_name: kanban_frontend
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - kanban_network

  # 后端
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: kanban-backend:latest
    container_name: kanban_backend
    environment:
      - PORT=5002
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-your_secret_key_here}
      - CORS_ORIGIN=*
    restart: unless-stopped
    networks:
      - kanban_network

networks:
  kanban_network:
    driver: bridge
